<!doctype html>
<html lang="en">
  <head>
    <base href="%BASE_URL%" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%images/Mena-logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100c0a" />
    <title>MENA Space Organization</title>

    <!-- Moved out of src/index.css: Lightning CSS cannot inline a remote @import, and a
         <link> lets the font request start in parallel with the stylesheet download. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap"
    />

    <!--
      Baseline SEO / social metadata. Deliberately conservative: drawn only from confirmed
      content — the Wadi Rum Mars analog mission, the youth STEM programmes, and the events and
      research areas that actually exist. No superlatives, no "first"/ranking claims, no
      statistics, no invented long-form legal name.

      Successive rewrites here each swapped one unsupported claim for another — "women-led",
      then "an independent Arab aerospace and analog training organization". Both asserted
      things (leadership structure, independence, organizational classification) that no
      authoritative source establishes. Metadata is public content, quoted verbatim in search
      results and social previews, so it is held to the same evidentiary standard as page copy.

      The descriptions below therefore say only what the SITE CONTAINS — pages that verifiably
      exist — and assert nothing about what the organization is, its standing, or its
      structure. Update them only against authoritative source material.

      og:image points at the official MENA logo — the one brand visual we have clear rights to
      and that is not a photograph of identifiable people. No event-specific share images were
      invented. This SPA cannot vary OG tags per route for non-JS crawlers; see useDocumentTitle.
    -->
    <meta
      name="description"
      content="The official website of MENA Space Organization: events, activities and programs, research papers, achievements, and the 2026 team."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MENA Space Organization" />
    <meta property="og:title" content="MENA Space Organization" />
    <meta
      property="og:description"
      content="Events, activities and programs, research papers, achievements, and the 2026 team of MENA Space Organization."
    />
    <meta property="og:image" content="%BASE_URL%images/Mena-logo-icon.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>

    <noscript>
      <div style="max-width: 560px; margin: 15vh auto; padding: 24px; font-family: Arial, sans-serif; line-height: 1.6">
        This website requires JavaScript. Enable JavaScript, then reload the page.
      </div>
    </noscript>

    <!-- The repository's index.html is Vite source, not a standalone compiled page. -->
    <div id="file-protocol-notice" style="display: none" role="alert">
      <div style="max-width: 560px; margin: 12vh auto 0">
        <p style="margin: 0 0 10px; color: #946039; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase">
          MENA website
        </p>
        <h1 style="margin: 0 0 16px; color: #241813; font-size: 28px; line-height: 1.2">
          Open the published website
        </h1>
        <p style="margin: 0 0 18px; color: #5d5049; font-size: 16px; line-height: 1.65">
          This source file cannot run by double-clicking it. The React application must be compiled by Vite.
        </p>
        <a
          href="https://rka14406.github.io/mena-website/"
          style="display: inline-block; margin: 0 0 22px; border-radius: 8px; background: #d9ad7c; color: #241813; padding: 12px 18px; font-weight: 700; text-decoration: none"
        >Open the live website</a>
        <p style="margin: 0; color: #74665e; font-size: 14px; line-height: 1.65">
          For local development, open a terminal in the project folder and run<br>
          <code style="color: #241813">npm install</code><br>
          <code style="color: #241813">npm run dev</code>
        </p>
      </div>
    </div>
    <script>
      (function () {
        if (window.location.protocol !== 'file:') return;
        document.getElementById('root').style.display = 'none';
        document.getElementById('file-protocol-notice').setAttribute(
          'style',
          'display:block;position:fixed;inset:0;z-index:10000;overflow:auto;' +
            'box-sizing:border-box;background:#f5f1eb;padding:24px;font-family:' +
            '-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;'
        );
      })();
    </script>

    <!--
      Below the supported floor the page previously rendered as a blank white screen: a
      `type="module"` script is silently ignored by browsers that cannot parse it, and
      Tailwind v4's output is wrapped in @layer, which browsers without cascade-layer
      support drop wholesale. Either way the visitor saw nothing and had no idea why.

      This notice is deliberately written in ES5 with inline styles and no Tailwind class,
      because it has to run in exactly the browsers where the module bundle and the
      stylesheet do not. CSSLayerBlockRule is the precise feature test — it exists in the
      same versions that support @layer (Safari/iOS 15.4+, Chrome 99+, Firefox 97+).
    -->
    <div id="unsupported-browser" style="display: none"></div>
    <script>
      (function () {
        var supported =
          typeof window.CSSLayerBlockRule !== 'undefined' &&
          typeof window.Promise !== 'undefined';
        if (supported) return;

        var el = document.getElementById('unsupported-browser');
        el.setAttribute(
          'style',
          'display:block;position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;' +
            'background:#3a2c26;color:#f3ede4;font-family:-apple-system,BlinkMacSystemFont,' +
            'Helvetica,Arial,sans-serif;padding:32px 24px;text-align:center;overflow:auto;' +
            '-webkit-box-sizing:border-box;box-sizing:border-box;'
        );
        el.innerHTML =
          '<div style="max-width:420px;margin:15vh auto 0">' +
          '<h1 style="font-size:20px;line-height:1.4;margin:0 0 16px;color:#cbad8e">' +
          'Please update your browser</h1>' +
          '<p style="font-size:15px;line-height:1.6;margin:0 0 20px">' +
          'This site needs a newer browser than the one on this device. ' +
          'On iPhone or iPad, open <strong>Settings &rsaquo; General &rsaquo; ' +
          'Software Update</strong> and install the latest iOS, then try again.</p>' +
          '<p style="font-size:15px;line-height:1.6;margin:0">' +
          'If your device cannot update, please reach us by email at ' +
          '<a href="mailto:contact@menaorg.com" style="color:#cbad8e">contact@menaorg.com</a>' +
          '.</p></div>';
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
