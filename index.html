<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/Mena-logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MENA Space Organization</title>

    <!--
      Baseline SEO / social metadata. Deliberately conservative: drawn only from confirmed
      content — the Wadi Rum Mars analog mission, the youth STEM programmes, and the events and
      research areas that actually exist. No superlatives, no "first"/ranking claims, no
      statistics, no invented long-form legal name.

      Successive rewrites here each swapped one unsupported claim for another — "women-led",
      then "an independent Arab aerospace and analog training organization". Both asserted
      things (leadership structure, independence, organizational classification) that no
      authoritative source establishes. Metadata is public content, quoted verbatim in search
      results and social previews, so it is held to the same evidentiary standard as page copy.

      The descriptions below therefore say only what the SITE CONTAINS — pages that verifiably
      exist — and assert nothing about what the organization is, its standing, or its
      structure. Update them only against authoritative source material.

      og:image points at the official MENA logo — the one brand visual we have clear rights to
      and that is not a photograph of identifiable people. No event-specific share images were
      invented. This SPA cannot vary OG tags per route for non-JS crawlers; see useDocumentTitle.
    -->
    <meta
      name="description"
      content="The official website of MENA Space Organization: events, activities and programs, research papers, achievements, and the 2026 team."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MENA Space Organization" />
    <meta property="og:title" content="MENA Space Organization" />
    <meta
      property="og:description"
      content="Events, activities and programs, research papers, achievements, and the 2026 team of MENA Space Organization."
    />
    <meta property="og:image" content="/images/Mena-logo-icon.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
